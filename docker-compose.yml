services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_DB: lightalm
      POSTGRES_USER: lightalm
      POSTGRES_PASSWORD: lightalm
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lightalm -d lightalm"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
