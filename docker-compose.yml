services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_DB: lightalm
      POSTGRES_USER: lightalm
      POSTGRES_PASSWORD: lightalm
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lightalm -d lightalm"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: lightalm
      DB_USER: lightalm
      DB_PASSWORD: lightalm
      CORS_ALLOWED_ORIGINS: http://localhost:5173
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8080:8080"

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: /api
    depends_on:
      - backend
    ports:
      - "5173:80"

volumes:
  pgdata:
